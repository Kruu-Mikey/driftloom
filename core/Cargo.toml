[package]
name = "dlcore"
version = "0.1.0"
edition = "2024"
publish = false
description = "Driftloom's audio core: the synth's voices, host-agnostic"
license-file = "../LICENSE"

# No dependencies, by design (roadmap 16).
[dependencies]

[lib]
# cdylib: the WebAssembly module the worklet loads. rlib: native tests,
# and any later native host.
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
